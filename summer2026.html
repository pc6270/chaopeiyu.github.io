<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大阪京都：魔法師之旅 2026</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        moss: '#8C9A7E',
                        terracotta: '#C18C5D',
                        'rice-paper': '#FDFCFB',
                        sand: '#F2EDE7',
                        stone: '#E8E2DA',
                    },
                    fontFamily: {
                        serif: ['Fraunces', 'serif'],
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #FDFCFB;
            color: #1d1b18;
            font-family: 'Nunito', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3BaseFilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/feTurbulence%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            mix-blend-mode: multiply;
            z-index: 9999;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        [x-cloak] { display: none !important; }

        .modal-enter { opacity: 0; transform: scale(0.95) translateY(20px); }
        .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.3s ease-out; }
    </style>
</head>
<body x-data="appData()" x-init="init()">

    <!-- Header -->
    <header @click="window.scrollTo({ top: 0, behavior: 'smooth' })" class="sticky top-2 z-[200] mx-3 bg-rice-paper/80 backdrop-blur-md px-4 py-2.5 flex items-center justify-between rounded-full shadow-lg border border-moss/10 sm:top-4 sm:mx-4 sm:px-6 sm:py-3 cursor-pointer active:scale-[0.98] transition-transform">
        <div class="logo font-serif font-extrabold text-base flex items-center gap-2 sm:text-lg">
            ✦ <span class="text-moss">魔法師</span>之旅
        </div>
        <div class="text-[0.6rem] font-bold text-moss/60 uppercase tracking-widest hidden sm:block">
            06.03 - 06.10
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 sm:px-5 sm:py-12">
        <!-- Hero -->
        <div class="text-center mb-10">
            <div class="inline-block text-[0.6rem] font-bold text-terracotta bg-terracotta/10 px-3 py-1 rounded-full mb-3 tracking-[0.2em] uppercase">
                Tour Guide 2026
            </div>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-3 text-moss font-serif leading-tight">
                大阪京都<br />魔法師之旅 🧙‍♂️
            </h1>
            <p class="text-moss/80 text-sm sm:text-base font-medium">
                8天7夜 · 大阪 · 京都 · 金澤
            </p>
        </div>

        <!-- Day Selector -->
        <div class="my-6 px-4 overflow-hidden">
            <div class="mx-auto bg-sand/50 rounded-full shadow-inner max-w-3xl overflow-x-auto no-scrollbar scroll-smooth touch-pan-x snap-x snap-mandatory">
                <div class="flex gap-4 p-2.5 min-w-max">
                    <template x-for="day in days" :key="day.id">
                        <button
                            @click="activeDay = day.id"
                            :class="activeDay === day.id ? 'bg-moss text-white scale-110 shadow-lg shadow-moss/30' : 'bg-white text-moss hover:bg-stone/50 shadow-sm'"
                            class="flex flex-col items-center justify-center w-12 h-12 rounded-full transition-all duration-300 shrink-0 snap-center"
                        >
                            <span class="font-serif text-[0.75rem] font-black leading-none" x-text="'D' + day.id"></span>
                            <span class="text-[0.4rem] font-bold uppercase mt-0.5" x-text="day.date.split('/')[1] + ' JUN'"></span>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <!-- Current Day Content -->
        <div class="mt-8">
            <div class="space-y-5">
                <div class="px-1 mb-5">
                    <h2 class="text-xl sm:text-2xl font-extrabold mb-1 text-moss font-serif" x-text="currentDay().date + ' ' + currentDay().title"></h2>
                    <p class="text-[0.65rem] font-bold text-terracotta uppercase tracking-[0.15em] opacity-80" x-text="currentDay().sub"></p>
                </div>

                <template x-for="(item, idx) in currentDay().items" :key="idx">
                    <div
                        @click="openModal(item)"
                        class="bg-white rounded-3xl shadow-xl shadow-moss/5 border border-moss/5 cursor-pointer transition-all duration-400 group overflow-hidden"
                    >
                        <div class="flex p-4 gap-4">
                            <div class="w-20 h-20 rounded-2xl overflow-hidden shrink-0 shadow-inner bg-sand">
                                <template x-if="getItemInfo(item).img">
                                    <img :src="getItemInfo(item).img" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt="">
                                </template>
                                <template x-if="!getItemInfo(item).img">
                                    <div class="w-full h-full flex items-center justify-center text-3xl" x-text="item.icon"></div>
                                </template>
                            </div>
                            <div class="flex-1 flex flex-col justify-center min-w-0">
                                <div class="flex items-center justify-between mb-1.5">
                                    <span class="font-serif text-[0.6rem] text-terracotta font-black uppercase tracking-widest bg-terracotta/5 px-2 py-0.5 rounded-md" x-text="item.time"></span>
                                    <span :class="{
                                        'bg-blue-50 text-blue-600 border-blue-100': item.badge === '交通',
                                        'bg-moss/10 text-moss border-moss/20': item.badge === '行程',
                                        'bg-terracotta/10 text-terracotta border-terracotta/20': item.badge === '用膳',
                                        'bg-purple-50 text-purple-600 border-purple-100': item.badge === '住宿',
                                        'bg-stone-50 text-stone-500 border-stone-200': !['交通', '行程', '用膳', '住宿'].includes(item.badge)
                                    }" class="text-[0.55rem] font-black tracking-widest uppercase shrink-0 border px-2 py-0.5 rounded-full" x-text="item.badge"></span>
                                </div>
                                <h3 class="text-base font-bold text-moss font-serif truncate leading-tight group-hover:text-terracotta transition-colors" x-text="item.title"></h3>
                                <template x-if="item.notice">
                                    <div class="mt-1.5 inline-flex items-center text-[0.55rem] text-terracotta font-extrabold px-2.5 py-0.5 rounded-full bg-terracotta/10 w-fit">
                                        ✧ <span x-text="item.notice"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Footer Lists -->
    <footer class="mt-16 bg-stone/40 rounded-t-[4rem] py-16 px-6">
    <div class="max-w-3xl mx-auto space-y-4">
        <!-- Hotels -->
        <button @click="openCategoryModal('hotels')" class="w-full bg-white p-6 rounded-[2rem] shadow-lg border border-moss/10 flex items-center justify-between group hover:bg-moss/5 transition-all">
            <div class="flex items-center gap-4">
                <div class="text-2xl bg-terracotta/10 w-12 h-12 rounded-full flex items-center justify-center">🏨</div>
                <div class="text-left">
                    <div class="text-sm font-bold text-moss tracking-widest uppercase font-serif">住宿資訊</div>
                    <div class="text-[0.6rem] text-moss/50 font-bold tracking-widest uppercase mt-0.5">Accommodation</div>
                </div>
            </div>
            <div class="text-moss/30 group-hover:translate-x-1 transition-transform"><i data-lucide="chevron-right"></i></div>
        </button>

        <!-- Shopping -->
        <button @click="openCategoryModal('shopping')" class="w-full bg-white p-6 rounded-[2rem] shadow-lg border border-moss/10 flex items-center justify-between group hover:bg-moss/5 transition-all">
            <div class="flex items-center gap-4">
                <div class="text-2xl bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center">🛍️</div>
                <div class="text-left">
                    <div class="text-sm font-bold text-moss tracking-widest uppercase font-serif">購物清單</div>
                    <div class="text-[0.6rem] text-moss/50 font-bold tracking-widest uppercase mt-0.5">Shopping List</div>
                </div>
            </div>
            <div class="text-moss/30 group-hover:translate-x-1 transition-transform"><i data-lucide="chevron-right"></i></div>
        </button>

        <!-- Emergency -->
        <button @click="openCategoryModal('emergency')" class="w-full bg-white p-6 rounded-[2rem] shadow-lg border border-moss/10 flex items-center justify-between group hover:bg-moss/5 transition-all">
            <div class="flex items-center gap-4">
                <div class="text-2xl bg-red-50 w-12 h-12 rounded-full flex items-center justify-center">📞</div>
                <div class="text-left">
                    <div class="text-sm font-bold text-moss tracking-widest uppercase font-serif">緊急連絡</div>
                    <div class="text-[0.6rem] text-moss/50 font-bold tracking-widest uppercase mt-0.5">Emergency</div>
                </div>
            </div>
            <div class="text-moss/30 group-hover:translate-x-1 transition-transform"><i data-lucide="chevron-right"></i></div>
        </button>
    </div>
    
    <div class="mt-12 pt-8 text-center text-[0.65rem] font-bold text-stone-500 tracking-[0.2em] border-t border-moss/10">
        SUMMER TOUR 2026
    </div>
</footer>
<!-- Category List Modal -->
<div x-cloak x-show="isListModalOpen" 
         class="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-moss/60 backdrop-blur-md"
         @click="isListModalOpen = false">
        <div class="relative w-full max-w-lg bg-rice-paper rounded-[2.5rem] shadow-2xl p-6 sm:p-8 max-h-[85vh] overflow-hidden flex flex-col" @click.stop>
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-extrabold text-moss font-serif" x-text="categoryTitle"></h2>
                    <p class="text-[0.6rem] font-black text-moss/50 tracking-[0.2em] uppercase" x-text="categorySub"></p>
                </div>
                <button @click="isListModalOpen = false" class="w-10 h-10 bg-sand rounded-full flex items-center justify-center text-moss">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>

            <div class="overflow-y-auto no-scrollbar space-y-3 pb-4">
                <template x-if="activeCategory === 'hotels'">
                    <template x-for="(h, k) in hotels" :key="k">
                        <button @click="openHotelModal(h); isListModalOpen = false" class="w-full text-left p-4 bg-white rounded-2xl border border-moss/10 flex items-center gap-4 hover:border-terracotta/30 transition-colors">
                            <div class="text-2xl w-12 h-12 bg-sand rounded-full flex items-center justify-center" x-text="h.emoji"></div>
                            <div class="min-w-0">
                                <div class="font-bold text-moss font-serif" x-text="h.name"></div>
                                <div class="text-[0.55rem] font-bold text-terracotta tracking-widest uppercase" x-text="h.dates"></div>
                            </div>
                        </button>
                    </template>
                </template>

                <template x-if="activeCategory === 'shopping'">
                    <template x-for="s in shoppingItems" :key="s.title">
                        <button @click="openShoppingModal(s); isListModalOpen = false" class="w-full text-left p-4 bg-white rounded-2xl border border-moss/10 flex items-center justify-between hover:border-terracotta/30 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="text-2xl w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center" x-text="s.icon"></div>
                                <div>
                                    <div class="font-bold text-moss font-serif" x-text="s.title"></div>
                                    <div class="text-[0.55rem] font-bold text-blue-500 tracking-widest uppercase" x-text="s.badge"></div>
                                </div>
                            </div>
                            <i data-lucide="chevron-right" class="text-moss/20" style="width: 14px; height: 14px;"></i>
                        </button>
                    </template>
                </template>

                <template x-if="activeCategory === 'emergency'">
                    <template x-for="c in emergencyContacts" :key="c.n">
                        <button @click="openEmergencyModal(c); isListModalOpen = false" class="w-full text-left p-4 bg-white rounded-2xl border border-moss/10 flex items-center justify-between hover:border-terracotta/30 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="text-2xl w-12 h-12 bg-red-50 rounded-full flex items-center justify-center" x-text="c.ico"></div>
                                <div>
                                    <div class="font-bold text-moss font-serif" x-text="c.n"></div>
                                    <div class="text-[0.7rem] font-black font-serif text-terracotta" x-text="c.num"></div>
                                </div>
                            </div>
                            <i data-lucide="chevron-right" class="text-moss/20" style="width: 14px; height: 14px;"></i>
                        </button>
                    </template>
                </template>
            </div>
        </div>
    </div>
    <!-- Modal -->
    <div x-cloak x-show="isModalOpen" 
         class="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-moss/80 backdrop-blur-xl"
         @click="closeModal()"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        
        <div x-show="isModalOpen"
             class="relative w-full max-w-lg bg-rice-paper rounded-[2.5rem] shadow-2xl overflow-hidden"
             @click.stop
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="scale-95 translate-y-4"
             x-transition:enter-end="scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="scale-100 translate-y-0"
             x-transition:leave-end="scale-95 translate-y-4">
            
            <button @click="closeModal()" class="absolute top-6 right-6 z-10 w-10 h-10 bg-white/40 hover:bg-white/60 backdrop-blur-md rounded-full flex items-center justify-center text-moss transition-colors">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
            <div class="absolute top-6 left-6 right-6 z-10 flex items-center justify-between">
                <button x-show="fromCategory" @click="backToList()" class="w-10 h-10 bg-rice-paper/80 hover:bg-white backdrop-blur-md rounded-full flex items-center justify-center text-moss transition-colors shadow-sm">
                    <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
                </button>
                <div x-show="!fromCategory"></div>
                <button @click="closeModal()" class="w-10 h-10 bg-rice-paper/80 hover:bg-white backdrop-blur-md rounded-full flex items-center justify-center text-moss transition-colors shadow-sm">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
            <template x-if="modalImg">
                <img :src="modalImg" class="w-full h-48 sm:h-60 object-cover" alt="">
            </template>
            <template x-if="!modalImg">
                <div class="w-full h-32 sm:h-40 bg-sand flex items-center justify-center text-5xl" x-text="modalEmoji"></div>
            </template>

            <div class="p-6 sm:p-8 overflow-y-auto no-scrollbar max-h-[70vh]">
                <template x-if="selectedItem?.suggestedArrival">
                    <div class="mb-4 text-[0.65rem] font-bold text-white bg-terracotta px-4 py-2.5 rounded-xl flex items-center shadow-lg">
                        <i data-lucide="clock" class="mr-2 shrink-0" style="width: 14px; height: 14px;"></i>
                        建議抵達報到：<span x-text="selectedItem.suggestedArrival"></span>
                    </div>
                </template>

                <div class="text-[0.6rem] font-black text-moss mb-1 tracking-[0.2em] uppercase">
                    <template x-if="isHotel"><span>Accommodation</span></template>
                    <template x-if="!isHotel"><span x-text="selectedItem?.type || ''"></span></template>
                     
                    <template x-if="isHotel"><span x-text="selectedHotel?.emoji || ''"></span></template>
                    <template x-if="!isHotel"><span x-text="selectedItem?.time || ''"></span></template>
                </div>
                <!-- <h2 class="text-2xl font-extrabold mb-3 text-moss font-serif leading-tight" x-text="isHotel ? (selectedHotel?.name || '') : (selectedItem?.title || '')"></h2> -->
                <h2 class="text-2xl font-extrabold mb-3 text-moss font-serif leading-tight"
                    x-text="isHotel ? (selectedHotel?.name || '') : isEmergency ? (selectedEmergency?.n || '') : isShopping ? (selectedShopping?.title || '') : (selectedItem?.title || '')"></h2>
                <p class="text-sm text-moss leading-relaxed mb-6 font-medium" x-text="modalDesc"></p>

                <div class="bg-stone/30 p-5 rounded-[1.5rem] mb-6 space-y-2.5">
                    <div class="text-[0.65rem] font-black text-lime-950 mb-2 uppercase tracking-widest border-b border-moss/20 pb-1">資訊</div>
                    <template x-if="isHotel && selectedHotel">
                         <div class="space-y-1.5">
                             <template x-if="selectedHotel.platform">
                                <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                    <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">訂房平台</span>
                                    <span class="text-xs font-bold text-moss" x-text="selectedHotel.platform""></span>
                                </div>
                            </template>
                            <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">CHECK-IN</span>
                                <span class="text-xs font-bold text-moss" x-text="selectedHotel.checkin"></span>
                            </div>
                            <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">CHECK-OUT</span>
                                <span class="text-xs font-bold text-moss" x-text="selectedHotel.checkout"></span>
                            </div>
                            <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">PHONE</span>
                                <span class="text-xs font-bold text-moss" x-text="selectedHotel.phone"></span>
                            </div>
                            <template x-if="selectedHotel.bookingID">
                                <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                    <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">BOOKING ID</span>
                                    <span class="text-xs font-bold text-moss" x-text="selectedHotel.bookingID"></span>
                                </div>
                            </template>
                            <div class="pt-2 flex flex-wrap gap-2">
                                <template x-for="a in selectedHotel.amenities" :key="a">
                                    <span class="px-2 py-0.5 bg-moss/20 rounded-full text-[0.55rem] font-black text-stone-700 uppercase tracking-tighter" x-text="a"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                    <!-- <template x-if="!isHotel && selectedItem?.details">
                        <div class="space-y-1.5">
                            <template x-if="selectedItem.bookingId">
                                <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                    <span class="text-[0.65rem] font-black text-lime-950 uppercase tracking-widest">BOOKING ID</span>
                                    <span class="text-xs font-bold text-lime-950" x-text="selectedItem.bookingId"></span>
                                </div>
                            </template>
                            <template x-for="(v, k) in selectedItem.details" :key="k">
                                <div x-show="k !== 'Map'" class="flex justify-between items-center border-b border-moss/10 py-1.5 last:border-0 text-right">
                                    <span class="text-[0.65rem] font-black text-lime-950 uppercase tracking-widest" x-text="k"></span>
                                    <span class="text-xs font-bold text-lime-950" x-text="v"></span>
                                </div>
                            </template>
                        </div>
                    </template> -->
                    <template x-if="isEmergency && selectedEmergency">
                        <div class="space-y-1.5">
                            <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">電話號碼</span>
                                <span class="text-xs font-bold text-moss" x-text="selectedEmergency.num"></span>
                            </div>
                            <div class="flex justify-between items-center py-1.5">
                                <span class="text-[0.65rem] font-black text-lime-950 tracking-widest uppercase">說明</span>
                                <span class="text-xs font-bold text-moss" x-text="selectedEmergency.note"></span>
                            </div>
                        </div>
                    </template>

                    <template x-if="isShopping && selectedShopping">
                        <div class="space-y-1.5">
                            <template x-for="(v, k) in selectedShopping.details" :key="k">
                                <div class="flex justify-between items-center border-b border-moss/10 py-1.5 last:border-0">
                                    <span class="text-[0.65rem] font-black text-lime-950 uppercase tracking-widest" x-text="k"></span>
                                    <span class="text-xs font-bold text-moss text-right ml-4" x-text="v"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="!isHotel && !isEmergency && !isShopping && selectedItem?.details">
                        <div class="space-y-1.5">
                            <template x-if="selectedItem.bookingId">
                                <div class="flex justify-between items-center border-b border-moss/10 py-1.5">
                                    <span class="text-[0.65rem] font-black text-lime-950 uppercase tracking-widest">BOOKING ID</span>
                                    <span class="text-xs font-bold text-lime-950" x-text="selectedItem.bookingId"></span>
                                </div>
                            </template>
                            <template x-for="(v, k) in selectedItem.details" :key="k">

                init() {
                    lucide.createIcons();
                },

                currentDay() {
                    return this.days.find(d => d.id === this.activeDay);
                },

                getItemInfo(item) {
                    if (item.type === 'hotel') return this.hotels[item.hotelKey] || {};
                    
                    return this.placeInfo[item.title] || {};
                },
                 resetFlags() {
                    this.modalImg = '';
                    this.fromCategory = null;
                    this.selectedItem = null;
                    this.selectedHotel = null;
                    this.selectedEmergency = null;
                    this.selectedShopping = null;
                    this.isHotel = false;
                    this.isEmergency = false;
                    this.isShopping = false;
                },

                openModal(item) {
                    this.resetFlags();
                    if (item.type === 'hotel' && this.hotels[item.hotelKey]) {
                        this.openHotelModal(this.hotels[item.hotelKey]);
                        return;
                    }
                    this.selectedItem = item;
                    this.isHotel = false;
                    const info = this.getItemInfo(item);
                    this.modalImg = info.img || '';
                    this.modalEmoji = item.icon || '';
                    this.modalDesc = info.desc || '';
                    this.isModalOpen = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                openHotelModal(hotel) {
                    const from = this.activeCategory;
                    this.resetFlags();
                    if (this.isListModalOpen) this.fromCategory = from;
                    this.selectedHotel = hotel;
                    this.isHotel = true;
                    this.selectedItem = { type: 'hotel', title: hotel.name, details: { Map: hotel.mapUrl } };
                    this.modalImg = hotel.img || '';
                    this.modalEmoji = hotel.emoji || '';
                    this.modalDesc = hotel.desc || '';
                    this.isModalOpen = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                openEmergencyModal(contact) {
                    const from = this.activeCategory;
                    this.resetFlags();
                    if (this.isListModalOpen) this.fromCategory = from;
                    this.selectedEmergency = contact;
                    this.isEmergency = true;
                    this.modalEmoji = contact.ico || '📞';
                    this.modalDesc = "緊急連絡資訊";
                    this.isModalOpen = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                openShoppingModal(item) {
                    const from = this.activeCategory;
                    this.resetFlags();
                    if (this.isListModalOpen) this.fromCategory = from;
                    this.selectedShopping = item;
                    this.isShopping = true;
                    this.modalEmoji = item.icon || '🛍️';
                    this.modalDesc = item.desc || "購物清單項目";
                    this.isModalOpen = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                openCategoryModal(category) {
                    this.activeCategory = category;
                    this.selectedItem = null;
                    this.selectedHotel = null;
                    this.selectedEmergency = null;
                    this.selectedShopping = null;
                    this.isHotel = false;
                    this.isEmergency = false;
                    this.isShopping = false;
                    if (category === 'hotels') {
                        this.categoryTitle = '住宿一覽';
                        this.categorySub = 'Accommodation';
                    } else if (category === 'shopping') {
                        this.categoryTitle = '購物清單';
                        this.categorySub = 'Shopping List';
                    } else if (category === 'emergency') {
                        this.categoryTitle = '緊急連絡';
                        this.categorySub = 'Emergency Contacts';
                    }
                    this.isListModalOpen = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                backToList() {
                    const cat = this.fromCategory;
                    this.closeModal();
                    if (cat) this.openCategoryModal(cat);
                },

                closeModal() {
                    this.isModalOpen = false;
                    this.selectedItem = null;
                    this.selectedHotel = null;
                }
            }
        }
    </script>
